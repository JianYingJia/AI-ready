sampling_fractions:
  - 0.25
  - 0.35
  - 0.50
  - 0.65
  - 0.80
  - 1.00
seeds:
  - 17
  - 31
  - 42
  - 73
  - 101
design_stratum_attributes:
  - knowledge_type
  - quality_bucket
  - benchmark_relevance
  - source_scope
# generation_status is observed only after the teacher-generation attempt and
# is audited as an outcome rather than used to choose the deployable sample.
audit_only_attributes:
  - generation_status
# Exploratory run only. Formal medical runs must preregister per-batch hard
# quotas for applicable conditions, contraindications, and exceptions.
rare_stratum_quotas: []
allow_target_expansion: true
