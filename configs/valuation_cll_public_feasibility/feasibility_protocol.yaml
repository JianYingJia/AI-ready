# 46 道 accuracy 题中，一题约为 0.0217。以下是本探索性试验预注册的
# 工程判定门槛，用于避免看完结果后改规则；它们不是统计学定律。
reference_identifiability:
  # 全量参考的最好/最差批次至少相差约三题。
  min_utility_range: 0.065
  # 批次均值的离散度至少约一题。
  min_between_batch_sd: 0.020
  # 批次内训练种子波动不得大于批次间信号。
  max_within_to_between_sd_ratio: 1.0
  # 三对训练种子排序的中位 Spearman 至少为中等正相关。
  min_pairwise_seed_rank_spearman_median: 0.50
  positive_margin: 0.0
  min_clearly_positive_batch_count: 2
  ci_separation_margin: 0.0
  # 12 个批次共有 66 对，至少约 7 对的 95% CI 完全分离。
  min_distinguishable_ci_pair_fraction: 0.10

target_decision:
  min_spearman: 0.60
  min_kendall_tau_b: 0.45
  min_pairwise_order_accuracy: 0.70
  # 允许选中的 Top-1 比全量参考最优批次低约两题以内。
  max_top1_regret: 0.0435
  # 主方法对每个基线都要有至少 0.05 的 Spearman 优势，且 Top-1
  # regret 不得更差；两项均需通过。
  min_spearman_advantage_over_each_baseline: 0.05
  max_top1_regret_excess_over_each_baseline: 0.0
  require_leave_one_seed_out_stability: true

# 全量参考批次效用差小于约一道题时，不强判顺序。
indifference_margin: 0.0217

# 当前 12 个批次只有 4 个 lineage group，分析会明确给出相关性警告。
minimum_independent_lineage_count_for_warning: 8
