  - contrast_id: noise_response_small_matches_full_10
    first_treatment_cell_id: clean_labels
    first_control_cell_id: label_noise_10
    second_treatment_cell_id: full_clean_labels
    second_control_cell_id: full_label_noise_10
    metric: training_utility
    pairing_keys: [batch_id, seed]
    independence_key: lineage_group
    direction: equivalent
    equivalence_margin: 0.0435
    minimum_pairs: 24
    minimum_independent_units: 4
    multiplicity_family: noise_secondary
    primary: false
    rationale: The low-noise point checks whether the two dose-response curves stay aligned.

- study_id: A8_base_model_prior
  stage: base_model_prior
  phase: screening
  evidence_role: training_mechanism
  target: Test whether independently measured model gaps change data value and whether prior-aware selection helps.
  causal_interpretation: true
  isolated_factors: [selector, prior_profile]
  cells:
  - cell_id: low_prior_aware
    description: Prior-aware selection for a preregistered low-prior checkpoint of the same model family.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality_prior_aware
      organization: mixed_grounded_v1
      source_budget_fraction: 0.25
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: controlled_low_prior
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: low_prior_agnostic
    description: Ignore the measured gap for the same low-prior checkpoint.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality_no_prior
      organization: mixed_grounded_v1
      source_budget_fraction: 0.25
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: controlled_low_prior
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: high_prior_aware
    description: Prior-aware selection for a preregistered high-prior checkpoint of the same model family.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality_prior_aware
      organization: mixed_grounded_v1
      source_budget_fraction: 0.25
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: controlled_high_prior
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: high_prior_agnostic
    description: Ignore the measured gap for the same high-prior checkpoint.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality_no_prior
      organization: mixed_grounded_v1
      source_budget_fraction: 0.25
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: controlled_high_prior
      training_mode: sft
      generator: coverage_guided_sft
  cell_gates:
  - gate_id: prior_gap_selection_alignment
    cell_id: low_prior_aware
    metric: prior_gap_selection_alignment
    direction: at_least
    threshold: 0.30
    independence_key: lineage_group
    minimum_observations: 8
    minimum_independent_units: 4
    multiplicity_family: prior_primary
    primary: true
    rationale: Selection must move toward independently measured capability gaps before utility is interpreted.
  contrasts:
  - contrast_id: prior_aware_low_state
    treatment_cell_id: low_prior_aware
    control_cell_id: low_prior_agnostic
    metric: training_utility
    pairing_keys: [batch_id, seed]
    independence_key: lineage_group
    direction: higher
    minimum_effect: 0.0
    minimum_pairs: 24
    minimum_independent_units: 4
    multiplicity_family: prior_primary
    primary: true
    rationale: Prior conditioning should improve utility for a state with known capability gaps.
  - contrast_id: prior_aware_high_state
    treatment_cell_id: high_prior_aware
    control_cell_id: high_prior_agnostic
    metric: training_utility
    pairing_keys: [batch_id, seed]
    independence_key: lineage_group
    direction: higher
    minimum_effect: 0.0
    minimum_pairs: 24
    minimum_independent_units: 4
    multiplicity_family: prior_secondary
    primary: false
    rationale: Report the same model-internal comparison in the high-prior state.
  interactions:
  - contrast_id: prior_state_interaction
    first_treatment_cell_id: low_prior_aware
    first_control_cell_id: low_prior_agnostic
    second_treatment_cell_id: high_prior_aware
    second_control_cell_id: high_prior_agnostic
    metric: training_utility
    pairing_keys: [batch_id, seed]
    independence_key: lineage_group
    direction: higher
    minimum_effect: 0.0
    minimum_pairs: 24
    minimum_independent_units: 4
    multiplicity_family: prior_primary
    primary: true
    rationale: The benefit of prior-aware selection should be larger in the preregistered low-prior state.

- study_id: A9_operational_fom_prediction
  stage: operational_external_validity
  phase: screening
  evidence_role: operational_prediction
  target: Predict the batch ranking and selection decision of the independent Fully Open Meditron full-data workflow.
  causal_interpretation: false
  isolated_factors: [selector, source_budget_fraction, organization, generator]
  cells:
  - cell_id: coverage_proxy
    description: Coverage-selected small sample generated by coverage_guided_sft.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality
      organization: mixed_grounded_v1
      source_budget_fraction: 0.25
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: native
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: fom_operational_full
    description: Fully Open Meditron independently processes the complete frozen raw batch.
    factors:
      mining: fully_open_meditron_internal
      blueprint: no_proxy_blueprint
      selector: no_proxy_selector
      organization: fully_open_meditron_recipe
      source_budget_fraction: 1.0
      repetition_factor: 1.0
      noise_kind: none
      noise_rate: 0.0
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: native
      training_mode: sft
      generator: fully_open_meditron
  cell_gates:
  - gate_id: operational_spearman
    cell_id: coverage_proxy
    metric: leave_one_lineage_out_spearman_to_fom
    direction: at_least
    threshold: 0.60
    independence_key: lineage_group
    minimum_observations: 4
    minimum_independent_units: 4
    multiplicity_family: operational_primary
    primary: true
    rationale: The cheap workflow must recover the operational full-data ranking.
  - gate_id: operational_pairwise_accuracy
    cell_id: coverage_proxy
    metric: leave_one_lineage_out_pairwise_accuracy_to_fom
    direction: at_least
    threshold: 0.70
    independence_key: lineage_group
    minimum_observations: 4
    minimum_independent_units: 4
    multiplicity_family: operational_primary
    primary: true
    rationale: Practically distinguishable batch pairs should usually be ordered correctly.
  - gate_id: operational_top1_regret
    cell_id: coverage_proxy
    metric: leave_one_lineage_out_top1_regret_to_fom
    direction: at_most
    threshold: 0.0435
    independence_key: lineage_group
    minimum_observations: 4
    minimum_independent_units: 4
    multiplicity_family: operational_primary
    primary: true
    rationale: The selected batch should remain within about two benchmark items of the operational optimum.
  - gate_id: operational_low_value_promotion
    cell_id: coverage_proxy
    metric: leave_one_lineage_out_low_value_promotion_rate_to_fom
    direction: at_most
    threshold: 0.20
    independence_key: lineage_group
    minimum_observations: 4
    minimum_independent_units: 4
    multiplicity_family: operational_primary
    primary: true
    rationale: A screening proxy must rarely promote an operationally low-value batch into the selected set.
  contrasts: []
