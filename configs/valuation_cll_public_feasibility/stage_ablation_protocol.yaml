  - contrast_id: clean_over_noise_10
    treatment_cell_id: clean_labels
    control_cell_id: label_noise_10
    metric: training_utility
    pairing_keys: [batch_id, seed]
    independence_key: lineage_group
    direction: higher
    minimum_effect: 0.0
    minimum_pairs: 24
    minimum_independent_units: 4
