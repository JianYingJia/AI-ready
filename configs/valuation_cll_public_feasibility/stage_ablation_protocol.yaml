      prior_profile: native
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: full_label_noise_10
    description: Apply the same 10 percent nested corruption to the complete same-generator candidate pool.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality
      organization: mixed_grounded_v1
      source_budget_fraction: 1.0
      repetition_factor: 1.0
      noise_kind: label_corruption
      noise_rate: 0.10
      base_model: Qwen/Qwen2.5-7B-Instruct
      prior_profile: native
      training_mode: sft
      generator: coverage_guided_sft
  - cell_id: full_label_noise_30
    description: Apply the same 30 percent nested corruption to the complete same-generator candidate pool.
    factors:
      mining: structured_rule_family_v1
      blueprint: task_weighted_v1
      selector: coverage_quality
      organization: mixed_grounded_v1
      source_budget_fraction: 1.0
      repetition_factor: 1.0
      noise_kind: label_corruption
      noise_rate: 0.30
